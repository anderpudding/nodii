<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        const theme = localStorage.getItem('nodii-theme');
        document.documentElement.classList.toggle(
          'dark',
          theme === 'dark' ||
            (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches),
        );
      } catch {
        document.documentElement.classList.toggle(
          'dark',
          matchMedia('(prefers-color-scheme: dark)').matches,
        );
      }
    </script>
    <script>
      try {
        const preference = localStorage.getItem('nodii-language');
        const language = (navigator.languages ?? [navigator.language])[0] ?? '';
        document.documentElement.lang =
          preference === 'ko' || preference === 'en'
            ? preference
            : language.toLowerCase().startsWith('ko')
              ? 'ko'
              : 'en';
      } catch {
        document.documentElement.lang = 'ko';
      }
    </script>
    <title>Nodii</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
