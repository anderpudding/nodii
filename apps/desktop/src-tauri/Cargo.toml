[package]
name = "nodii"
version = "0.1.0"
description = "Nodii — 모든 기기에서 같은 하루를 보여주는 투두 앱"
authors = ["Sungjun Lee"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# bin 이름과 겹치지 않게 `_lib` 접미사를 붙인다
name = "nodii_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 앱 크기 최적화 (NFR-04) https://tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
