<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>Open your Nodii invite</title>
    <link rel="icon" href="/img/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/fonts/pretendard.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="/">
          <img src="/img/icon.svg" alt="" width="30" height="30" />Nodii
        </a>
      </div>
    </header>
    <main class="hero">
      <div class="wrap">
        <h1>Open your Nodii invite</h1>
        <p class="lead">Get Nodii, then tap your original invite link again.</p>
        <div class="actions">
          <div class="badges">
            <a class="badge" href="https://apps.apple.com/app/id6812983213">
              <picture>
                <source
                  srcset="/img/badges/download-on-the-app-store-white-en-us.svg"
                  media="(prefers-color-scheme: dark)"
                />
                <img
                  src="/img/badges/download-on-the-app-store-black-en-us.svg"
                  width="144"
                  height="48"
                  alt="Download on the App Store"
                />
              </picture>
            </a>
            <a class="badge" href="https://apps.apple.com/app/id6812983213">
              <picture>
                <source
                  srcset="/img/badges/download-on-the-mac-app-store-white-en-us.svg"
                  media="(prefers-color-scheme: dark)"
                />
                <img
                  src="/img/badges/download-on-the-mac-app-store-black-en-us.svg"
                  width="187"
                  height="48"
                  alt="Download on the Mac App Store"
                />
              </picture>
            </a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
