name: Release

# v* 태그를 푸시하면 검증 → Universal .pkg 서명 → App Store Connect 업로드 (설계서 §11.3)
# 필요한 Secrets·Variables와 만드는 방법은 docs/05-release-runbook.md 참고.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  appstore:
    name: build · sign · upload
    needs: check
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PROFILE_PATH: apps/desktop/src-tauri/profiles/Nodii_MAS.provisionprofile
      ENV_FILE: apps/desktop/.env.production.local
    steps:
      - uses: actions/checkout@v7

      - name: Check version matches tag
        run: |
          set -euo pipefail
          tauri_version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          package_version=$(node -p "require('./apps/desktop/package.json').version")
          if [[ "$tauri_version" != "$package_version" ]]; then
            echo "::error::tauri.conf.json($tauri_version)과 apps/desktop/package.json($package_version)의 version이 다릅니다. scripts/bump-version.sh를 사용하세요."
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$tauri_version" ]]; then
              echo "::error::태그 $GITHUB_REF_NAME 과 앱 버전 $tauri_version 이 다릅니다."
              exit 1
            fi
          fi
          echo "앱 버전: $tauri_version"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Import signing certificates
        env:
          APPLE_DISTRIBUTION_CERT_P12: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          APPLE_INSTALLER_CERT_P12: ${{ secrets.APPLE_INSTALLER_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          for name in APPLE_DISTRIBUTION_CERT_P12 APPLE_INSTALLER_CERT_P12 APPLE_CERT_PASSWORD; do
            if [[ -z "${!name}" ]]; then echo "::error::Secret $name 이 없습니다."; exit 1; fi
          done
          KEYCHAIN_PATH="$RUNNER_TEMP/nodii-signing.keychain-db"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          keychain_password=$(openssl rand -base64 32)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          cert_dir=$(mktemp -d "$RUNNER_TEMP/certs.XXXXXX")
          printf '%s' "$APPLE_DISTRIBUTION_CERT_P12" | base64 --decode > "$cert_dir/distribution.p12"
          printf '%s' "$APPLE_INSTALLER_CERT_P12" | base64 --decode > "$cert_dir/installer.p12"
          for cert in distribution installer; do
            security import "$cert_dir/$cert.p12" -k "$KEYCHAIN_PATH" -f pkcs12 \
              -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          done
          rm -rf "$cert_dir"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$KEYCHAIN_PATH" > /dev/null
          # 기존 로그인 키체인은 유지하고 임시 키체인을 검색 목록 맨 앞에 둔다.
          existing=$(security list-keychains -d user | tr -d '"' | xargs)
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$KEYCHAIN_PATH" $existing

      - name: Resolve signing identities
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
        run: |
          set -euo pipefail
          # Secrets에 이름이 있으면 그대로 쓰고, 없으면 임시 키체인에서 찾는다.
          signing="${APPLE_SIGNING_IDENTITY:-}"
          installer="${APPLE_INSTALLER_IDENTITY:-}"
          if [[ -z "$signing" ]]; then
            signing=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | grep -oE '"Apple Distribution: [^"]+"' | head -n 1 | tr -d '"' || true)
          fi
          if [[ -z "$installer" ]]; then
            installer=$(security find-identity -v -p basic "$KEYCHAIN_PATH" \
              | grep -oE '"(3rd Party Mac Developer Installer|Mac Installer Distribution): [^"]+"' \
              | head -n 1 | tr -d '"' || true)
          fi
          if [[ -z "$signing" || -z "$installer" ]]; then
            echo "::error::키체인에서 Apple Distribution 또는 Installer 인증서를 찾지 못했습니다."
            exit 1
          fi
          {
            echo "APPLE_SIGNING_IDENTITY=$signing"
            echo "APPLE_INSTALLER_IDENTITY=$installer"
          } >> "$GITHUB_ENV"
          echo "서명 인증서: $signing"
          echo "설치 인증서: $installer"

      - name: Restore provisioning profile and API key
        env:
          MAS_PROVISION_PROFILE: ${{ secrets.MAS_PROVISION_PROFILE }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          for name in MAS_PROVISION_PROFILE APPLE_API_KEY_ID APPLE_API_KEY_P8; do
            if [[ -z "${!name}" ]]; then echo "::error::Secret $name 이 없습니다."; exit 1; fi
          done
          mkdir -p "$(dirname "$PROFILE_PATH")"
          printf '%s' "$MAS_PROVISION_PROFILE" | base64 --decode > "$PROFILE_PATH"
          key_dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$key_dir"
          key_file="$key_dir/AuthKey_${APPLE_API_KEY_ID}.p8"
          # .p8 내용을 그대로 넣었거나 base64로 넣었거나 둘 다 받는다.
          if [[ "$APPLE_API_KEY_P8" == -----BEGIN* ]]; then
            printf '%s\n' "$APPLE_API_KEY_P8" > "$key_file"
          else
            printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$key_file"
          fi
          chmod 600 "$key_file"

      - name: Write production env
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_REVIEW_ACCOUNT_EMAIL: ${{ vars.VITE_REVIEW_ACCOUNT_EMAIL || secrets.VITE_REVIEW_ACCOUNT_EMAIL }}
          VITE_APP_STORE_ID: ${{ vars.VITE_APP_STORE_ID || secrets.VITE_APP_STORE_ID }}
          VITE_PRIVACY_URL: ${{ vars.VITE_PRIVACY_URL }}
          VITE_TERMS_URL: ${{ vars.VITE_TERMS_URL }}
          VITE_SUPPORT_URL: ${{ vars.VITE_SUPPORT_URL }}
        run: |
          set -euo pipefail
          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY; do
            if [[ -z "${!name}" ]]; then echo "::error::$name 이 없습니다 (Variables 또는 Secrets)."; exit 1; fi
          done
          if [[ "$VITE_SUPABASE_URL" != https://* ]]; then
            echo "::error::VITE_SUPABASE_URL은 https:// 주소여야 합니다."; exit 1
          fi
          # 앱에는 publishable(anon) 키만 넣는다. secret/service_role 키면 중단한다 (AGENTS.md §6).
          key="$VITE_SUPABASE_PUBLISHABLE_KEY"
          if [[ "$key" == sb_secret_* ]]; then
            echo "::error::secret 키가 들어 있습니다. publishable 키만 쓰세요."; exit 1
          fi
          if [[ "$key" == eyJ* ]]; then
            payload=$(printf '%s' "$key" | cut -d. -f2 | tr '_-' '/+')
            while (( ${#payload} % 4 )); do payload="$payload="; done
            if printf '%s' "$payload" | base64 --decode 2>/dev/null | grep -q '"role" *: *"service_role"'; then
              echo "::error::service_role 키가 들어 있습니다. anon/publishable 키만 쓰세요."; exit 1
            fi
          fi
          umask 077
          {
            echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$VITE_SUPABASE_PUBLISHABLE_KEY"
            echo "VITE_REVIEW_ACCOUNT_EMAIL=$VITE_REVIEW_ACCOUNT_EMAIL"
            echo "VITE_APP_STORE_ID=$VITE_APP_STORE_ID"
            echo "VITE_PRIVACY_URL=$VITE_PRIVACY_URL"
            echo "VITE_TERMS_URL=$VITE_TERMS_URL"
            echo "VITE_SUPPORT_URL=$VITE_SUPPORT_URL"
          } > "$ENV_FILE"

      - name: Build and upload
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          # 빌드 번호는 업로드마다 커져야 한다. 로컬 스크립트 기본값과 같은 UTC 시각 형식을 써서
          # 로컬·CI 업로드가 섞여도 단조 증가한다.
          BUNDLE_VERSION="$(date -u +%Y%m%d%H%M)"
          export BUNDLE_VERSION
          echo "빌드 번호: $BUNDLE_VERSION"
          bash scripts/build-appstore.sh

      - uses: actions/upload-artifact@v4
        with:
          name: nodii-pkg-${{ github.run_number }}
          path: dist-appstore/*.pkg
          retention-days: 7
          if-no-files-found: warn

      - name: Clean up signing material
        if: always()
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true; fi
          rm -rf "$HOME/.appstoreconnect/private_keys"
          rm -f "$PROFILE_PATH" "$ENV_FILE" apps/desktop/src-tauri/Entitlements.appstore.plist
